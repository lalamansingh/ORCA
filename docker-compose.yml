services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orca}
      POSTGRES_USER: ${POSTGRES_USER:-orca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orca_local_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - orca-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: ./apps/api
    env_file:
      - ./apps/api/.env
    environment:
      APP_ENV: development
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-orca}:${POSTGRES_PASSWORD:-orca_local_dev_password}@db:5432/${POSTGRES_DB:-orca}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-compose-secret-change-before-production-123456}
      FRONTEND_URL: http://localhost:${WEB_PORT:-3000}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
      COOKIE_SECURE: "false"
      ORCA_DEMO_MODE: ${ORCA_DEMO_MODE:-false}
      ALERT_PROVIDERS: ${ALERT_PROVIDERS:-imd_cap,incois}
      PFZ_PROVIDERS: ${PFZ_PROVIDERS:-incois_wfs}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
  migrate:
    build:
      context: ./apps/api
    command: [".venv/bin/alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-orca}:${POSTGRES_PASSWORD:-orca_local_dev_password}@db:5432/${POSTGRES_DB:-orca}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  orca-postgres-data:
