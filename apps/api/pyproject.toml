[project]
name = "orca-api"
version = "0.1.0"
description = "ORCA Marine Intelligence API foundation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "geoalchemy2>=0.17,<1.0",
  "alembic>=1.14,<2.0",
  "pwdlib[argon2]>=0.3,<1.0",
  "pyjwt>=2.10,<3.0",
  "email-validator>=2.2,<3.0",
  "httpx>=0.28,<1.0",
  "langgraph>=0.6,<2.0",
  "pydantic-settings>=2.7,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
  "pip-audit>=2.10.1",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false

[tool.ruff.lint]
# Fatal syntax/name errors; preserve established formatting during release freeze.
select = ["E9", "F821", "F822", "F823"]
